<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Concepts</title>
<style>
  :root { --bg:#fdf8ee; --ink:#2b2d42; --accent:#4361ee; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Trebuchet MS", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:860px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 6px; font-size:2rem; }
  p.sub { margin:0 0 24px; color:#555; font-size:1.1rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  a.card { display:block; background:#fff; border:3px solid var(--ink); border-radius:18px; padding:18px; color:inherit; text-decoration:none; transition:transform .15s; }
  a.card:hover, a.card:focus-visible { transform:translateY(-4px); border-color:var(--accent); }
  .card .icon { font-size:2.4rem; }
  .card h2 { margin:8px 0 4px; font-size:1.25rem; }
  .card p { margin:0; color:#555; }
  .card .tag { display:inline-block; margin-top:10px; font-size:.8rem; background:#eef1ff; color:var(--accent); padding:2px 10px; border-radius:99px; }
</style>
</head>
<body>
<main>
  <h1>Maths Concepts</h1>
  <p class="sub">Interactive animations to help understand how maths works.</p>
  <div class="grid">
    <!-- Add new concepts by copying a card below -->
    <a class="card" href="subtraction-regrouping/">
      <div class="icon">➖</div>
      <h2>Subtraction: regrouping</h2>
      <p>See why we swap 1 ten for 10 ones (also called borrowing). Up to 4 digits.</p>
      <span class="tag">Subtraction</span>
    </a>
  </div>
</main>
</body>
</html>
